# ===========================================
# 云端编译 APK - GitHub Actions
# ===========================================
# 使用方法：
# 1. 推送到 GitHub 仓库
# 2. Actions 页面手动触发 "Build APK"
# 3. 自动下载 Gradle → 生成 wrapper → 编译 → 下载 APK
# ===========================================

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

  # 推送代码自动触发
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 下载 Gradle 并生成 wrapper
        run: |
          # 下载 Gradle 8.5
          curl -sL https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 🔧 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ 编译 APK (${{ github.event.inputs.build_type || 'debug' }})
        run: |
          ./gradlew assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-daemon

      - name: 📦 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SportApp-${{ github.event.inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: warn
          retention-days: 30
